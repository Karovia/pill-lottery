<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吃药大转盘</title>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="title">吃药大转盘</div>
    <div class="right">
      <span class="remain" id="remain">剩余 14/14</span>
      <button class="text-btn" id="muteBtn">声音 开</button>
      <div class="red-wrap">
        <div class="pixel-ring" id="resetRing"></div>
        <button class="red-btn" id="resetBtn" title="工作人员补货后长按 2 秒">RESET</button>
      </div>
    </div>
  </header>

  <main>
    <div class="ampm-badge" id="ampmBadge">白天 · 上午的药</div>
    <canvas id="stage" width="560" height="560"></canvas>
    <div class="status" id="status">正在载入…</div>
  </main>

  <footer class="footer">点击恐龙或按空格跳跃 · 素材来自网络 · 仅内部使用</footer>

  <!-- 结算视频 -->
  <div class="overlay hidden" id="clipOverlay">
    <div class="clip-frame">
      <div class="clip-title" id="clipTitle"></div>
      <video id="clipVideo" playsinline preload="auto"></video>
      <div class="clip-fallback hidden" id="clipFallback">
        <div class="fallback-quote" id="fallbackQuote"></div>
        <div class="fallback-source" id="fallbackSource"></div>
      </div>
      <button class="text-btn skip" id="skipBtn">跳过 &gt;&gt;</button>
    </div>
  </div>

  <!-- 周日下午特别奖励 -->
  <div class="overlay hidden" id="giftOverlay">
    <div class="gift-card">
      <img id="giftImg" alt="小礼品">
      <div class="gift-big">周日 · 下午 特别奖励！</div>
      <div class="gift-sub">额外小礼品一份，找工作人员领取</div>
    </div>
  </div>

  <script src="js/clips.js?v=4"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
